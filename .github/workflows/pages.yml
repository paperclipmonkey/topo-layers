name: Deploy to GitHub Pages

# The legacy branch-based Pages build started failing instantly with no
# diagnostic beyond "Page build failed", so the site is deployed from here
# instead: it publishes the repo as-is and, when something does go wrong, leaves
# a log you can actually read.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
